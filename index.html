    <title>ছাত্র হাজিরা খাতা</title>
    <script>
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var rawFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          if (!rawFetch && typeof globalThis !== 'undefined') {
            rawFetch = globalThis.fetch;
          }
          if (typeof rawFetch === 'function') {
            var activeFetch = rawFetch.bind(window);
            var fetchProp = {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = typeof fn === 'function' ? fn : activeFetch;
              },
              configurable: true,
              enumerable: true
            };

            try {
              Object.defineProperty(window, 'fetch', fetchProp);
            } catch (e) {}

            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', fetchProp);
              } catch (e) {}
            }

            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              try {
                Object.defineProperty(globalThis, 'fetch', fetchProp);
              } catch (e) {}
            }
          }
        } catch (err) {}
      })();
    </script>
